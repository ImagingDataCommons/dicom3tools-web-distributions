name: CI

# Checks the page and scripts. The wasm is not in the repository; build.yml
# builds and checks it when something that goes into it changes.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install test dependency
        run: npm install --no-save jsdom

      - name: Syntax check
        run: |
          for f in public/*.js test-ui.js check-build.js; do
            node --check "$f"
          done
          bash -n build.sh
          bash -n test.sh
          bash -n fetch-wasm.sh

      - name: UI and catalog tests
        run: node test-ui.js
