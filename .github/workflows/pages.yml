name: Deploy to GitHub Pages

# Publishes public/ from main together with the wasm of the latest published
# release. Nothing is compiled here: build.yml builds the wasm and drafts a
# release, and publishing that release is what ships it.
#
# Runs when a release is published (new wasm) and when the page itself changes
# on main (same wasm, new page). Both deploy main's page with the latest
# release, so a page change never rolls the wasm back, and a release never
# brings back an old page.
#
# Requires Pages to be set to "GitHub Actions" as its source, once, under
# Settings - Pages.

on:
  push:
    branches: [main]
    paths:
      - public/**
      - fetch-wasm.sh
      - check-build.js
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so main never lands
# on a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A release event checks out the release's commit by default, which
      # may be older than main; the page always comes from main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch the latest published wasm
        run: ./fetch-wasm.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Not --pin: upstream.env may already name a newer build whose release
      # has not been published yet, and serving the previous one is correct.
      - name: Check the wasm
        run: node check-build.js

      - uses: actions/configure-pages@v6

      # GitHub Pages serves assets with max-age=600 and does not allow setting
      # response headers, so a stylesheet or script change is invisible for up
      # to ten minutes. Stamping the links with the commit sha makes each
      # deploy request a URL the browser has not seen. The wasm and its loader
      # are stamped with the release tag instead: they are 7MB, change only
      # with a release, and busting them every deploy would re-download them
      # for no reason.
      - name: Stamp asset links
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=8 HEAD)"
          tag="$(cat .release-tag)"
          for asset in dicom3tools.js dicom3tools.wasm; do
            sed -i "s|\(['\"]\)$asset\1|\1$asset?v=$tag\1|g" public/worker.js
          done
          for asset in style.css build-info.js tools.js app.js worker.js; do
            sed -i "s|\(['\"]\)$asset\1|\1$asset?v=$sha\1|g; s|=\"$asset\"|=\"$asset?v=$sha\"|g" \
              public/index.html public/app.js
          done
          echo "--- stamped references ---"
          grep -oE '(src|href)="[^"]+\?v=[a-f0-9]+"' public/index.html || true
          grep -oE "Worker\('[^']+'\)" public/app.js || true
          grep -oE "(importScripts|fetch)\('[^']+'\)" public/worker.js || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
