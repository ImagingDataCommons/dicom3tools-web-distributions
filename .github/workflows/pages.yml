name: Deploy to GitHub Pages

# Publishes public/ as-is. Nothing is compiled here: the wasm is built by
# build.sh and committed, so a deploy is a file copy.
#
# Requires Pages to be set to "GitHub Actions" as its source, once, under
# Settings - Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so main never lands
# on a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
